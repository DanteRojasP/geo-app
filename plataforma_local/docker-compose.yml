# Levanta la plataforma completa en http://localhost:8000
#   docker compose up --build
# Los datos de Cusco vienen de la raíz del repositorio (../data/harmonized y
# ../harmonizacion/cusco_ref). Para usar otra ubicación, define FIRECAL_HARMONIZED_SRC y
# FIRECAL_CUSCO_REF_SRC (por ejemplo en un archivo .env junto a este).
services:
  firecal:
    build:
      context: .
      additional_contexts:
        harmonized: ${FIRECAL_HARMONIZED_SRC:-../data/harmonized}
        cusco_ref: ${FIRECAL_CUSCO_REF_SRC:-../harmonizacion/cusco_ref}
    image: firecal-cusco:local
    ports:
      - "8000:8000"
    restart: unless-stopped
